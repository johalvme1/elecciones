<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Elecciones{% endblock %}</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .countdown {
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(79, 70, 229, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }
        a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div style="flex: 1; text-align: left; display: flex; align-items: center;">
            <img src="/media/logoEscuela.jpg" alt="Logo Escuela" style="height: 100px; object-fit: contain; border-radius: 8px; background: white; padding: 5px;">
        </div>
        <div style="flex: 2; text-align: center;">
            <h1 style="margin: 0; font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; color: #818cf8; text-shadow: 0 0 20px rgba(129,140,248,0.5);">Elecciones 2026</h1>
        </div>
        <div style="flex: 1; text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center;">
            {% if user.is_authenticated %}
                <div style="font-size: 1rem; margin-top: 10px;">
                    <span>Estación: {{ user.username }}</span> | 
                    <form action="{% url 'voting:logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" style="background:transparent; color:#ef4444; border:none; cursor:pointer; font-weight:bold; font-size: 1rem;">Salir</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="glass-card" style="margin-bottom: 1rem; text-align: center; border-color: #22c55e; background: rgba(34, 197, 94, 0.1); color: #4ade80;">
                    <h3 style="margin:0; font-size: 2rem;">{{ message }}</h3>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>


</body>
</html>
