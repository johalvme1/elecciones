{% extends 'voting/base.html' %}
{% block title %}Acceso a Resultados{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;text-align:center;">
    <h2 style="font-size:2rem;margin-bottom:0.5rem;">Acceso a Resultados</h2>
    <p style="color:var(--text-muted);margin-bottom:2rem;">Ingrese el PIN de acceso para ver los resultados</p>
    <form method="post" style="max-width:300px;width:100%;">
        {% csrf_token %}
        <input type="password" name="pin" placeholder="PIN" style="width:100%;padding:0.75rem;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:white;box-sizing:border-box;text-align:center;font-size:1.5rem;letter-spacing:8px;" required>
        <button type="submit" style="width:100%;padding:0.8rem;margin-top:1rem;background:var(--primary);color:white;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;">Ingresar</button>
    </form>
    <a href="{% url 'voting:home' %}" style="margin-top:1.5rem;color:var(--text-muted);">Volver al inicio</a>
</div>
{% endblock %}
